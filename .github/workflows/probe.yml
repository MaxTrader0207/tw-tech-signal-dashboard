name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for e in 0050 0051 00733 00878 006208 00713 00919 00929; do
            u="https://www.moneydj.com/ETF/X/Basic/Basic0007B.xdjhtm?etfid=$e.TW"
            curl -sSL -m 30 -A "$UA" -o out.bin "$u" || true
            python3 -c "
          import re;t=open('out.bin','rb').read().decode('utf-8','ignore')
          c=re.findall(r'>[^<>]{1,30}\((\d{4,6}[A-Z]?)\.(TW|TWO)\)<',t); m=re.search(r'資料日期[^0-9]{0,40}([0-9/]{8,10})',t)
          print('RES $e', len(c), 'TWO', sum(1 for x in c if x[1]=='TWO'), 'date', m.group(1) if m else None, c[:2])"
          done
