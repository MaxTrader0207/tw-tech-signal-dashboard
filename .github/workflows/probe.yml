name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0,'scripts')
          import scan
          syms=['2330.TW','2317.TW','2454.TW','0050.TW','00878.TW','00929.TW']
          px=scan.fetch_prices(syms)
          cl={k:scan.drop_intraday(list(v)) for k,v in px.items()}
          ref=[r['date'] for r in cl['2330.TW']]
          for e in ('0050','00878','00929'):
              rows,add=scan.patch_gaps(e, cl[e+'.TW'], ref)
              miss=[d for d in ref if d>=rows[0]['date'] and d not in {r['date'] for r in rows}]
              print('RES',e,'補',add,'最後',[(r['date'],r['open'],r['close'],r['adj'],r['volume']) for r in rows[-3:]],'全期仍缺',len(miss),miss[:6])
          PY
