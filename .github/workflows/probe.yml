name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for e in 0050 0051; do for pg in Basic0007 Basic0007B Basic0007b; do
            u="https://www.moneydj.com/ETF/X/Basic/$pg.xdjhtm?etfid=$e.TW"; echo "=== $u"
            curl -sSL -m 30 -A "$UA" -o out.bin -w "HTTP %{http_code} %{size_download}B\n" "$u" || true
            python3 -c "
          import re;t=open('out.bin','rb').read().decode('utf-8','ignore')
          c=re.findall(r'>([^<>]{1,20})\((\d{4,6}[A-Z]?)\.(TW|TWO)\)<',t); print('n',len(c),'uniq',len(set(x[1] for x in c)),c[:3],c[-3:])
          m=re.search(r'資料日期[^0-9]{0,40}([0-9/]{8,10})',t); print('date',m.group(1) if m else None)"
          done; done
